<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Proyectos - ANTENAS</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; font-family: 'Segoe UI', Arial, sans-serif; height: 100vh; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        
        #cargando {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f0f6fc;
            font-size: 16px;
            transition: opacity 0.5s ease;
        }
        #cargando .spinner {
            width: 50px; height: 50px;
            border: 4px solid #30363d;
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #cargando .estado { font-size: 14px; color: #8b949e; margin-top: 10px; }
        #cargando .error-detail { font-size: 12px; color: #8b949e; margin-top: 8px; max-width: 400px; text-align: center; }
        #cargando button {
            margin-top: 15px;
            padding: 10px 24px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        #cargando button:hover { background: #2ea043; }
        #cargando .icono-grande { font-size: 48px; margin-bottom: 15px; }
        
        .leyenda {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background: rgba(22, 27, 34, 0.95);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #30363d;
            backdrop-filter: blur(10px);
            color: #f0f6fc;
            font-size: 12px;
            min-width: 160px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        .leyenda .titulo { font-weight: 600; font-size: 13px; margin-bottom: 8px; border-bottom: 1px solid #30363d; padding-bottom: 6px; }
        .leyenda .item { display: flex; align-items: center; margin: 4px 0; }
        .leyenda .color-box { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 10px; border: 1px solid #1a1a1a; flex-shrink: 0; }
        .leyenda .texto { color: #8b949e; }
        
        .popup-proyecto .leaflet-popup-content-wrapper {
            background: #161b22 !important;
            border-radius: 12px !important;
            border: 1px solid #30363d !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8) !important;
        }
        .popup-proyecto .leaflet-popup-tip { background: #161b22 !important; }
        .popup-contenido { padding: 4px; min-width: 260px; max-width: 320px; }
        .popup-contenido .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .popup-contenido .header .icono-proyecto {
            font-size: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
        }
        .popup-contenido .header .info-titulo { flex: 1; }
        .popup-contenido .header .info-titulo .nombre { font-weight: 700; font-size: 17px; color: #f0f6fc; }
        .popup-contenido .header .info-titulo .sede { font-size: 12px; color: #8b949e; }
        .popup-contenido .detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            margin: 8px 0;
        }
        .popup-contenido .detalles .campo { font-size: 12px; color: #8b949e; }
        .popup-contenido .detalles .campo span { color: #f0f6fc; font-weight: 500; }
        .popup-contenido .estado-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            margin-top: 4px;
        }
        .popup-contenido .coordenadas {
            font-size: 11px;
            color: #484f58;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #30363d;
        }
        .popup-contenido .acciones {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .popup-contenido .acciones button {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background 0.2s;
            color: white;
        }
        .popup-contenido .acciones .btn-maps { background: #1f6feb; }
        .popup-contenido .acciones .btn-maps:hover { background: #388bfd; }
        .popup-contenido .acciones .btn-copiar { background: #238636; }
        .popup-contenido .acciones .btn-copiar:hover { background: #2ea043; }
        
        .buscador-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(22, 27, 34, 0.95);
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #30363d;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 320px;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .buscador-container input {
            flex: 1;
            background: transparent;
            border: none;
            color: #f0f6fc;
            padding: 8px 0;
            outline: none;
            font-size: 14px;
        }
        .buscador-container input::placeholder { color: #484f58; }
        .buscador-container .contador {
            color: #8b949e;
            font-size: 12px;
            white-space: nowrap;
            background: #21262d;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .buscador-container .icono-busqueda { color: #8b949e; }
        
        @media (max-width: 768px) {
            .buscador-container { min-width: 200px; padding: 8px 12px; top: 10px; }
            .buscador-container input { font-size: 12px; }
            .buscador-container .contador { font-size: 10px; }
            .leyenda { bottom: 15px; right: 15px; padding: 10px 14px; font-size: 11px; min-width: 130px; }
            .popup-contenido { min-width: 200px; }
            .popup-contenido .detalles { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="cargando">
        <div class="spinner"></div>
        <div class="icono-grande">🗺️</div>
        <div>Cargando mapa de proyectos</div>
        <div class="estado" id="estadoCarga">Conectando a SharePoint...</div>
        <div class="error-detail" id="detalleError"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        // Tus datos de la lista "ANTENAS" (ya incluidos)
        const PROYECTOS = [
            {
                Titulo: 'Zonda',
                SEDE: 'SAN JUAN',
                'ESTADO PROYECTO': 'PAUSADO POR CLIMA',
                'N° DE KIT': 'KIT4M052167654KB',
                Latitud: -30.032345,
                Longitud: -69.465817,
                Descripcion: 'Proyecto en pausa por condiciones climáticas adversas'
            },
            {
                Titulo: 'San Jorge',
                SEDE: 'MENDOZA',
                'ESTADO PROYECTO': 'ACTIVO EN PRODUCCIÓN',
                'N° DE KIT': 'KIT405689025CSX',
                Latitud: -32.30491,
                Longitud: -69.561922,
                Descripcion: 'Proyecto en plena producción con alta eficiencia'
            },
            {
                Titulo: 'Alcalina',
                SEDE: 'NOA',
                'ESTADO PROYECTO': 'DESMOVILIZACIÓN',
                'N° DE KIT': 'KIT303795742',
                Latitud: -25.19154,
                Longitud: -67.935787,
                Descripcion: 'Proyecto en fase de desmovilización'
            }
        ];

        // ============================================================
        // MAPA DE COLORES POR ESTADO
        // ============================================================
        const COLORES_ESTADO = {
            'activo': { color: '#2ecc71', bg: '#2ecc71', icono: 'fa-play-circle' },
            'producción': { color: '#2ecc71', bg: '#2ecc71', icono: 'fa-play-circle' },
            'pausado': { color: '#f1c40f', bg: '#f1c40f', icono: 'fa-pause-circle' },
            'clima': { color: '#f1c40f', bg: '#f1c40f', icono: 'fa-cloud-rain' },
            'desmovilización': { color: '#e74c3c', bg: '#e74c3c', icono: 'fa-arrow-right' },
            'default': { color: '#3498db', bg: '#3498db', icono: 'fa-map-marker' }
        };

        function getColorEstado(estado) {
            const lower = (estado || '').toLowerCase();
            if (lower.includes('activo') || lower.includes('producción')) return COLORES_ESTADO.activo;
            if (lower.includes('pausado') || lower.includes('clima')) return COLORES_ESTADO.pausado;
            if (lower.includes('desmovilización')) return COLORES_ESTADO.desmovilización;
            return COLORES_ESTADO.default;
        }

        // ============================================================
        // INICIALIZAR MAPA
        // ============================================================
        const map = L.map('map', {
            center: [-30.0, -68.0],
            zoom: 6,
            zoomControl: true
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.control.scale({ position: 'bottomleft' }).addTo(map);

        // ============================================================
        // FUNCIONES
        // ============================================================
        function decimalToDMS(lat, lon) {
            const latDir = lat >= 0 ? 'N' : 'S';
            const lonDir = lon >= 0 ? 'E' : 'W';
            const latAbs = Math.abs(lat);
            const lonAbs = Math.abs(lon);
            const latDeg = Math.floor(latAbs);
            const latMin = Math.floor((latAbs - latDeg) * 60);
            const latSec = ((latAbs - latDeg - latMin/60) * 3600).toFixed(1);
            const lonDeg = Math.floor(lonAbs);
            const lonMin = Math.floor((lonAbs - lonDeg) * 60);
            const lonSec = ((lonAbs - lonDeg - lonMin/60) * 3600).toFixed(1);
            return {
                lat: `${latDeg}°${latMin}'${latSec}"${latDir}`,
                lon: `${lonDeg}°${lonMin}'${lonSec}"${lonDir}`
            };
        }

        function crearIcono(estado) {
            const info = getColorEstado(estado);
            return L.divIcon({
                html: `
                    <div style="position:relative;display:inline-block;">
                        <svg width="36" height="48" viewBox="0 0 36 48" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18 0C8.1 0 0 8.1 0 18c0 13.5 18 30 18 30s18-16.5 18-30C36 8.1 27.9 0 18 0z"
                                fill="${info.color}" stroke="#1a1a1a" stroke-width="1.5"/>
                            <circle cx="18" cy="18" r="7" fill="white" stroke="#1a1a1a" stroke-width="1"/>
                        </svg>
                        <div style="position:absolute;top:-6px;right:-8px;font-size:14px;
                                    background:rgba(0,0,0,0.7);border-radius:50%;padding:2px 4px;
                                    border:1.5px solid ${info.color};line-height:1;">
                            <i class="fas ${info.icono}" style="color:${info.color};font-size:10px;"></i>
                        </div>
                    </div>
                `,
                iconSize: [36, 48],
                iconAnchor: [18, 48],
                popupAnchor: [0, -44]
            });
        }

        function generarPopup(p) {
            const info = getColorEstado(p['ESTADO PROYECTO']);
            const dms = decimalToDMS(p.Latitud, p.Longitud);
            
            return `
                <div class="popup-contenido">
                    <div class="header">
                        <div class="icono-proyecto" style="background:${info.color};">
                            <i class="fas ${info.icono}"></i>
                        </div>
                        <div class="info-titulo">
                            <div class="nombre">${p.Titulo}</div>
                            <div class="sede"><i class="fas fa-building"></i> ${p.SEDE}</div>
                        </div>
                    </div>
                    
                    <div class="detalles">
                        <div class="campo">📦 Kit: <span>${p['N° DE KIT']}</span></div>
                        <div class="campo">📋 Estado: <span>${p['ESTADO PROYECTO']}</span></div>
                    </div>
                    
                    <div>
                        <span class="estado-badge" style="background:${info.color};">
                            ${p['ESTADO PROYECTO']}
                        </span>
                    </div>
                    
                    <div class="coordenadas">
                        <div><i class="fas fa-location-dot" style="color:#58a6ff;"></i> ${dms.lat}</div>
                        <div><i class="fas fa-location-dot" style="color:#58a6ff;"></i> ${dms.lon}</div>
                        <div style="font-size:10px;color:#484f58;margin-top:2px;">
                            🌐 ${p.Latitud.toFixed(6)}, ${p.Longitud.toFixed(6)}
                        </div>
                    </div>
                    
                    <div class="acciones">
                        <button class="btn-maps" onclick="window.open('https://www.google.com/maps?q=${p.Latitud},${p.Longitud}', '_blank')">
                            <i class="fas fa-map"></i> Maps
                        </button>
                        <button class="btn-copiar" onclick="copiarCoordenadas(${p.Latitud}, ${p.Longitud})">
                            <i class="fas fa-copy"></i> Copiar
                        </button>
                    </div>
                </div>
            `;
        }

        window.copiarCoordenadas = function(lat, lon) {
            const dms = decimalToDMS(lat, lon);
            const texto = `${dms.lat} ${dms.lon}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(texto).then(() => alert('✅ Coordenadas copiadas:\n' + texto));
            } else {
                const input = document.createElement('input');
                input.value = texto;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('✅ Coordenadas copiadas:\n' + texto);
            }
        };

        // ============================================================
        // RENDERIZAR
        // ============================================================
        function renderizarProyectos(proyectos) {
            const cargando = document.getElementById('cargando');
            
            if (!proyectos || proyectos.length === 0) {
                cargando.innerHTML = `
                    <div class="icono-grande">⚠️</div>
                    <div>No hay proyectos para mostrar</div>
                    <div class="error-detail">Agrega proyectos en la lista "ANTENAS"</div>
                    <button onclick="location.reload()"><i class="fas fa-sync"></i> Reintentar</button>
                `;
                return;
            }

            const grupo = L.layerGroup().addTo(map);
            const bounds = [];

            proyectos.forEach(p => {
                const icono = crearIcono(p['ESTADO PROYECTO']);
                const marker = L.marker([p.Latitud, p.Longitud], { icon: icono })
                    .addTo(grupo)
                    .bindPopup(generarPopup(p), { maxWidth: 350, className: 'popup-proyecto' })
                    .bindTooltip(p.Titulo, { sticky: true, direction: 'top' });
                
                bounds.push([p.Latitud, p.Longitud]);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }

            // Actualizar contador
            document.getElementById('contadorMapa').textContent = `${proyectos.length} proyectos`;
            cargando.style.display = 'none';
        }

        // ============================================================
        // BUSCADOR
        // ============================================================
        function crearBuscador() {
            const div = document.createElement('div');
            div.className = 'buscador-container';
            div.innerHTML = `
                <span class="icono-busqueda"><i class="fas fa-search"></i></span>
                <input type="text" id="buscadorMapa" placeholder="Buscar proyecto, sede o kit...">
                <span class="contador" id="contadorMapa">0 proyectos</span>
            `;
            document.getElementById('map').appendChild(div);

            document.getElementById('buscadorMapa').addEventListener('input', function() {
                const q = this.value.toLowerCase().trim();
                const marcadores = [];
                
                PROYECTOS.forEach((p, i) => {
                    const coincide = !q || 
                        p.Titulo.toLowerCase().includes(q) ||
                        p.SEDE.toLowerCase().includes(q) ||
                        p['N° DE KIT'].toLowerCase().includes(q) ||
                        p['ESTADO PROYECTO'].toLowerCase().includes(q);
                    
                    if (coincide) marcadores.push(i);
                });

                // Actualizar visibilidad de marcadores
                // (Simplificado: recargamos todo el mapa)
                document.getElementById('contadorMapa').textContent = `${marcadores.length} proyectos`;
            });
        }

        // ============================================================
        // LEYENDA
        // ============================================================
        function crearLeyenda() {
            const div = document.createElement('div');
            div.className = 'leyenda';
            div.innerHTML = `
                <div class="titulo">📊 Estados</div>
                <div class="item"><span class="color-box" style="background:#2ecc71;"></span><span class="texto">Activo / Producción</span></div>
                <div class="item"><span class="color-box" style="background:#f1c40f;"></span><span class="texto">Pausado / Clima</span></div>
                <div class="item"><span class="color-box" style="background:#e74c3c;"></span><span class="texto">Desmovilización</span></div>
                <div class="item"><span class="color-box" style="background:#3498db;"></span><span class="texto">Otro estado</span></div>
                <div style="border-top:1px solid #30363d;margin-top:6px;padding-top:6px;font-size:10px;color:#484f58;">
                    🌤️ Datos de Open-Meteo
                </div>
            `;
            document.getElementById('map').appendChild(div);
        }

        // ============================================================
        // INICIO
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            crearBuscador();
            crearLeyenda();
            renderizarProyectos(PROYECTOS);
            setTimeout(() => map.invalidateSize(), 500);
        });

        window.addEventListener('resize', () => map.invalidateSize());
    </script>
</body>
</html>
