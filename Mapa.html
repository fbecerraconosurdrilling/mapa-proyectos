<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Proyectos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        .cargando {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
        }
        .cargando .spinner {
            display: inline-block;
            width: 30px; height: 30px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="cargando" class="cargando">
        <div class="spinner"></div>
        <div>Cargando mapa...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================================
        // CONFIGURACIÓN - ¡SOLO CAMBIA ESTO SI ES NECESARIO!
        // ============================================================
        const CONFIG = {
            // URL BASE DE TU SITIO DE SHAREPOINT
            siteUrl: 'https://conosurdrillingsa.sharepoint.com/sites/ANTENAS',
            // NOMBRE DE TU LISTA
            listaProyectos: 'ANTENAS'
        };

        // ============================================================
        // INICIALIZAR MAPA
        // ============================================================
        const map = L.map('map').setView([-30.0, -68.0], 6);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ============================================================
        // OBTENER DATOS DE SHAREPOINT
        // ============================================================
        async function cargarDatos() {
            try {
                const url = `${CONFIG.siteUrl}/_api/web/lists/getbytitle('${CONFIG.listaProyectos}')/items`;
                console.log('📡 Conectando a:', url);

                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json;odata=verbose'
                    },
                    credentials: 'same-origin'
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                const items = data.d ? data.d.results : [];
                console.log('📦 Datos obtenidos:', items.length);

                // Filtrar y convertir coordenadas
                const proyectos = items.filter(item => {
                    let lat = item.Latitud || item.Latitude;
                    let lon = item.Longitud || item.Longitude;
                    
                    // Convertir a número si es string con coma
                    if (typeof lat === 'string') lat = parseFloat(lat.replace(',', '.'));
                    if (typeof lon === 'string') lon = parseFloat(lon.replace(',', '.'));
                    
                    item.Latitud = lat;
                    item.Longitud = lon;
                    
                    return !isNaN(lat) && !isNaN(lon) && lat !== null && lon !== null;
                });

                console.log('🗺️ Proyectos con coordenadas:', proyectos.length);

                if (proyectos.length === 0) {
                    document.getElementById('cargando').innerHTML = `
                        <div>⚠️ No hay proyectos con coordenadas</div>
                        <div style="font-size:12px;color:#8b949e;margin-top:8px;">
                            Verifica que tu lista tenga Latitud y Longitud<br>
                            <span style="color:#f1c40f;">💡 Usa punto (.) no coma (,)</span>
                        </div>
                        <button onclick="location.reload()" style="margin-top:10px;padding:8px 20px;background:#238636;color:white;border:none;border-radius:4px;cursor:pointer;">
                            Reintentar
                        </button>
                    `;
                    return;
                }

                // Agregar marcadores
                proyectos.forEach(p => {
                    const color = p['ESTADO PROYECTO']?.toLowerCase().includes('activo') ? '#2ecc71' :
                                  p['ESTADO PROYECTO']?.toLowerCase().includes('pausado') ? '#f1c40f' :
                                  p['ESTADO PROYECTO']?.toLowerCase().includes('desmovilización') ? '#e74c3c' : '#3498db';
                    
                    const marker = L.marker([p.Latitud, p.Longitud]).addTo(map);
                    marker.bindPopup(`
                        <b>${p.Title || 'Sin nombre'}</b><br>
                        🏢 ${p.SEDE || 'Sin sede'}<br>
                        📦 ${p['N° DE KIT'] || 'Sin kit'}<br>
                        <span style="color:${color};font-weight:bold;">${p['ESTADO PROYECTO'] || 'Sin estado'}</span><br>
                        <span style="font-size:11px;color:#666;">${p.Latitud.toFixed(6)}, ${p.Longitud.toFixed(6)}</span>
                    `);
                });

                // Ajustar mapa a los marcadores
                const group = L.featureGroup(proyectos.map(p => L.marker([p.Latitud, p.Longitud])));
                map.fitBounds(group.getBounds().pad(0.2));

                document.getElementById('cargando').style.display = 'none';

            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('cargando').innerHTML = `
                    <div>❌ Error al cargar datos</div>
                    <div style="font-size:12px;color:#8b949e;margin-top:8px;">${error.message}</div>
                    <button onclick="location.reload()" style="margin-top:10px;padding:8px 20px;background:#238636;color:white;border:none;border-radius:4px;cursor:pointer;">
                        Reintentar
                    </button>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarDatos);
    </script>
</body>
</html>
