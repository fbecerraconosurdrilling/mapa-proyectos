<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Proyectos</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #map { height: 100vh; width: 100%; }
        .cargando {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
        }
        .cargando .spinner {
            display: inline-block;
            width: 30px; height: 30px;
            border: 3px solid #30363d;
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .cargando button {
            margin-top: 10px;
            padding: 8px 20px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .cargando button:hover { background: #2ea043; }
        .cargando .error-detail {
            font-size: 12px;
            color: #8b949e;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="cargando" class="cargando">
        <div class="spinner"></div>
        <div>Cargando mapa...</div>
        <div class="error-detail">Conectando a SharePoint...</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        // Lista de proyectos con coordenadas (¡YA INCLUYE TUS DATOS!)
        // Si esto funciona, luego podemos conectarlo a SharePoint
        const DATOS_DE_PRUEBA = [
            {
                Titulo: 'Zonda',
                SEDE: 'SAN JUAN',
                'ESTADO PROYECTO': 'PAUSADO POR CLIMA',
                'N° DE KIT': 'KIT4M052167654KB',
                Latitud: -30.032345,
                Longitud: -69.465817
            },
            {
                Titulo: 'San Jorge',
                SEDE: 'MENDOZA',
                'ESTADO PROYECTO': 'ACTIVO EN PRODUCCIÓN',
                'N° DE KIT': 'KIT405689025CSX',
                Latitud: -32.30491,
                Longitud: -69.561922
            },
            {
                Titulo: 'Alcalina',
                SEDE: 'NOA',
                'ESTADO PROYECTO': 'DESMOVILIZACIÓN',
                'N° DE KIT': 'KIT303795742',
                Latitud: -25.19154,
                Longitud: -67.935787
            }
        ];

        // ============================================================
        // INICIALIZAR MAPA
        // ============================================================
        const map = L.map('map').setView([-30.0, -68.0], 6);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ============================================================
        // FUNCIÓN PARA MOSTRAR PROYECTOS EN EL MAPA
        // ============================================================
        function mostrarProyectos(proyectos) {
            const cargando = document.getElementById('cargando');
            
            if (!proyectos || proyectos.length === 0) {
                cargando.innerHTML = `
                    <div>⚠️ No hay proyectos para mostrar</div>
                    <div class="error-detail">Agrega proyectos con coordenadas en la lista</div>
                    <button onclick="location.reload()">Reintentar</button>
                `;
                return;
            }

            console.log('🗺️ Mostrando', proyectos.length, 'proyectos');

            // Agregar marcadores
            proyectos.forEach(p => {
                const color = p['ESTADO PROYECTO']?.toLowerCase().includes('activo') ? '#2ecc71' :
                              p['ESTADO PROYECTO']?.toLowerCase().includes('pausado') ? '#f1c40f' :
                              p['ESTADO PROYECTO']?.toLowerCase().includes('desmovilización') ? '#e74c3c' : '#3498db';
                
                const marker = L.marker([p.Latitud, p.Longitud]).addTo(map);
                marker.bindPopup(`
                    <b style="font-size:15px;">${p.Titulo || 'Sin nombre'}</b><br>
                    🏢 ${p.SEDE || 'Sin sede'}<br>
                    📦 ${p['N° DE KIT'] || 'Sin kit'}<br>
                    <span style="color:${color};font-weight:bold;">${p['ESTADO PROYECTO'] || 'Sin estado'}</span><br>
                    <span style="font-size:11px;color:#666;">📍 ${p.Latitud.toFixed(6)}, ${p.Longitud.toFixed(6)}</span>
                `);
            });

            // Ajustar mapa a los marcadores
            const group = L.featureGroup(proyectos.map(p => L.marker([p.Latitud, p.Longitud])));
            map.fitBounds(group.getBounds().pad(0.2));

            cargando.style.display = 'none';
        }

        // ============================================================
        // INTENTAR CONECTAR A SHAREPOINT
        // ============================================================
        async function cargarDesdeSharePoint() {
            try {
                // Primero intentamos con la URL del sitio
                const siteUrl = 'https://conosurdrillingsa-my.sharepoint.com';
                const listName = 'ANTENAS';
                
                // Usamos la API de Microsoft Graph (más compatible con OneDrive)
                const url = `${siteUrl}/_api/web/lists/getbytitle('${listName}')/items?$select=Title,SEDE,ESTADO_PROYECTO,N_x00b0__x0020_DE_KIT,Latitud,Longitud`;
                
                console.log('📡 Conectando a:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json;odata=verbose'
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                const items = data.d ? data.d.results : [];
                console.log('📦 Datos obtenidos:', items.length);

                // Procesar y filtrar proyectos con coordenadas
                const proyectos = items
                    .map(item => {
                        // Mapear nombres de campos (pueden tener nombres diferentes en SharePoint)
                        let lat = item.Latitud || item.Latitude || item.latitud;
                        let lon = item.Longitud || item.Longitude || item.longitud;
                        
                        // Convertir si son strings con coma
                        if (typeof lat === 'string') lat = parseFloat(lat.replace(',', '.'));
                        if (typeof lon === 'string') lon = parseFloat(lon.replace(',', '.'));
                        
                        return {
                            Titulo: item.Title || item.Titulo || 'Sin nombre',
                            SEDE: item.SEDE || item.Sede || 'Sin sede',
                            'ESTADO PROYECTO': item['ESTADO_PROYECTO'] || item.Estado || 'Sin estado',
                            'N° DE KIT': item['N_x00b0__x0020_DE_KIT'] || item['N° DE KIT'] || item.Kit || 'Sin kit',
                            Latitud: lat,
                            Longitud: lon
                        };
                    })
                    .filter(p => !isNaN(p.Latitud) && !isNaN(p.Longitud) && p.Latitud !== null && p.Longitud !== null);

                if (proyectos.length > 0) {
                    mostrarProyectos(proyectos);
                    return true;
                } else {
                    console.warn('⚠️ No se encontraron proyectos con coordenadas en SharePoint');
                    return false;
                }

            } catch (error) {
                console.error('❌ Error conectando a SharePoint:', error);
                return false;
            }
        }

        // ============================================================
        // CARGA PRINCIPAL
        // ============================================================
        async function iniciar() {
            const cargando = document.getElementById('cargando');
            
            // Intentar cargar desde SharePoint
            const exito = await cargarDesdeSharePoint();
            
            // Si falla, usar datos de prueba
            if (!exito) {
                console.log('📋 Usando datos de prueba');
                cargando.querySelector('.error-detail').textContent = 'Usando datos de prueba...';
                setTimeout(() => {
                    mostrarProyectos(DATOS_DE_PRUEBA);
                }, 500);
            }
        }

        document.addEventListener('DOMContentLoaded', iniciar);
    </script>
</body>
</html>
